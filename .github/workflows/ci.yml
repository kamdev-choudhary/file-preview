name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Entry size budget
        run: pnpm run size

      - name: Validate published package
        run: pnpm exec publint

      # `cjs-resolves-to-esm` is ignored on purpose: this package is ESM-only by
      # design, so a CommonJS consumer needing a dynamic import is the intended
      # outcome rather than a packaging mistake.
      - name: Validate published types
        run: >
          pnpm dlx @arethetypeswrong/cli --pack --profile node16
          --ignore-rules cjs-resolves-to-esm

  matrix:
    # The library ships to browsers, but contributors and CI build it on Node,
    # so the supported Node range has to actually work.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
