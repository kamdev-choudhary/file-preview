name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # `github-pages` is a GitHub-managed environment. It does not exist until
    # Pages is enabled, which is what `enablement: true` below takes care of —
    # editors may flag the name as unknown until that first successful run.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate sample files
        run: pnpm run samples

      - name: Build demo
        run: pnpm run build:demo

      # `enablement: true` turns Pages on via the API if it is not already
      # configured. Without it, the very first run fails with "Get Pages site
      # failed" because the site does not exist yet.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo
      - id: deploy
        uses: actions/deploy-pages@v5
