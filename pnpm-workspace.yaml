# pnpm 12 reads its settings from here rather than package.json's "pnpm" field.

# Only these packages may run install scripts. Everything else is blocked, so a
# compromised transitive dependency cannot execute code at install time.
onlyBuiltDependencies:
  - esbuild

# Do NOT auto-install optional peers. `xlsx` is an intentionally opt-in peer:
# the npm build of SheetJS is frozen at 0.18.5 with unfixed prototype-pollution
# and ReDoS advisories that fire while parsing untrusted files — exactly what
# this library does. Installing it here would quietly undo that decision for
# every contributor and CI run. Consumers opt in explicitly via configure().
autoInstallPeers: false
